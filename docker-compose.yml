services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recs
      POSTGRES_PASSWORD: recs
      POSTGRES_DB: recs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recs -d recs"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
